# Temporaire : bissection du blocage du runner de tests. À supprimer une fois la cause trouvée.
name: Debug hang
on: workflow_dispatch

jobs:
  debug:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - name: Sondes
        run: |
          set +e
          # `script` force un pty : sans lui, la sortie reste bufferisée et disparaît au kill.
          script -q /tmp/tty.txt swift test --no-parallel --filter AppCoreTests > /dev/null 2>&1 &
          PID=$!
          sleep 100
          if kill -0 $PID 2>/dev/null; then
            echo "=== BLOQUÉ. Derniers événements de test :"
            grep -E "started|passed|failed" /tmp/tty.txt | tail -6
            echo "=== Pile des threads Pepito :"
            for p in $(pgrep -f swiftpm-testing-helper); do
              sample $p 2 -file /tmp/hang.txt >/dev/null 2>&1
              grep -E "Pepito|AppCore|TranscriptionKit|CaptureKit|Speech|Security|EventKit|AVF|Audio" /tmp/hang.txt | head -30
            done
            kill -9 $PID; pkill -9 -f swiftpm-testing-helper
            exit 1
          fi
          wait $PID; echo "✔ terminé"
