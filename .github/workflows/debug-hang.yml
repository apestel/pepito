# Temporaire : bissection du blocage du runner de tests. À supprimer une fois la cause trouvée.
name: Debug hang
on: workflow_dispatch

jobs:
  debug:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - name: Sondes
        run: |
          set +e
          probe() {                       # probe <secondes> <libellé> <commande…>
            local t=$1 label=$2; shift 2
            echo "═══ $label"
            ( "$@" > /tmp/out.txt 2>&1 ) & local pid=$!
            local i=0
            while [ $i -lt "$t" ] && kill -0 $pid 2>/dev/null; do sleep 1; i=$((i+1)); done
            if kill -0 $pid 2>/dev/null; then
              echo "⏳ BLOQUÉ après ${t}s"; kill -9 $pid 2>/dev/null
              pkill -9 -f swiftpm-testing-helper 2>/dev/null
            else
              wait $pid; echo "✔ terminé (exit $?)"
            fi
            tail -12 /tmp/out.txt
          }
          probe 60  "list-tests"                swift test --list-tests
          probe 90  "un seul module pur"        swift test --filter VaultKitTests
          probe 90  "module liant l'app"        swift test --filter HeatmapTests
          probe 90  "sans parallélisme"         swift test --no-parallel --filter VaultKitTests
          echo "═══ exécution directe du bundle"
          find .build -name "*.xctest" -o -name "PepitoPackageTests" -type f | head -5
