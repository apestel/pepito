# CI Pépito. macos-26 est GA sur les runners GitHub-hosted, en arm64 natif, avec Xcode 26.x —
# les prérequis du projet (macOS 26 Tahoe + Apple Silicon) sont donc couverts sans runner perso.
# Les diagnostics de VM sont exécutés localement ; le runner vérifie les tests et le bundle.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45   # une minute macOS coûte ×10 : jamais de job qui traîne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Runtime tests
        run: |
          npm ci --ignore-scripts --prefix Runtime
          npm test --prefix Runtime
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Tests
        run: swift test
      - name: Bundle .app
        run: ./build-app.sh release   # le bundle doit s'assembler, pas seulement compiler
